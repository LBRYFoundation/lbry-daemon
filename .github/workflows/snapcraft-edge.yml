name: Snapcraft Edge

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: canonical/craft-actions/snapcraft/pack@v1
        id: build
      - uses: actions/upload-artifact@v7
        with:
          name: snap-packages.zip
          path: ./*.snap
      - name: Upload
        run: for f in ${{ steps.build.outputs.snaps }}; do snapcraft upload --release=edge "$f"; done
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}